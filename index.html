<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Pie</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }

    /* ===== DROPDOWN STYLES =====
       These control how the word list looks, so it's the same in every browser. */

    /* Holds the search bar and its dropdown.
       "position: relative" lets the dropdown sit right underneath the search bar. */
    .search-area {
      position: relative;
      display: inline-block;
    }

    /* The dropdown list itself */
    .word-list {
      position: absolute;
      top: 100%;              /* just below the search bar */
      left: 0;
      min-width: 100%;        /* at least as wide as the search bar */
      max-height: 220px;      /* with lots of words, scroll instead of growing */
      overflow-y: auto;
      background: white;
      border: 1px solid #ccc;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      z-index: 10;            /* keeps it on top of everything else */
      font-size: 16px;        /* undo the big heading size */
      font-weight: normal;    /* undo the bold heading text */
      line-height: 1.4;
      text-align: left;
    }

    /* Each word in the list */
    .word-option {
      display: block;
      padding: 4px 8px;
      color: black;
      white-space: nowrap;    /* keeps each word on one line */
      cursor: pointer;
    }

    /* A word under the mouse, or chosen with the arrow keys */
    .word-option:hover,
    .word-option.highlighted {
      background: #e8e8e8;
    }
  </style>
</head>

<!-- bgcolor="black" makes the whole page background black -->
<body bgcolor="black">

  <h1 style="color:white;">Damn.</h1>

  <!--
    THE SENTENCE
    The search bar sits where the blank goes.
    The empty "word-list" gets filled with words by the script at the bottom.
    "hidden" means the list starts out invisible.
  -->
  <h2 style="color:white;">
    I really want a
    <span class="search-area" id="search-area">
      <input type="text" id="search-box" placeholder="Search..." autocomplete="off">
      <span class="word-list" id="word-list" hidden></span>
    </span>
  </h2>

  <!-- THE BUTTON (starts hidden, appears once a word is picked) -->
  <button id="universe-button" hidden>invent the universe</button>


  <script>
    // ===== 1. THE WORD LIST =====
    // Every word that can show up in the dropdown.
    // To add one, put it in quotes and add a comma after it.
    const words = [
      // Food & drinks
      "apple", "apple pie", "bagel", "banana", "burger", "burrito", "cake", "candy bar",
      "cheeseburger", "cookie", "croissant", "cup of coffee", "cup of tea", "cupcake", "donut",
      "hot dog", "ice cream cone", "lollipop", "mango", "milkshake", "muffin", "orange", "pancake",
      "peach", "pickle", "pie", "pizza", "pretzel", "sandwich", "slice of cake", "smoothie",
      "snack", "soda", "steak", "taco", "waffle", "watermelon",

      // Animals
      "alpaca", "bunny", "cat", "dog", "dolphin", "duck", "elephant", "ferret", "frog", "giraffe",
      "goat", "goldfish", "hamster", "hedgehog", "horse", "kitten", "koala", "lizard", "monkey",
      "octopus", "otter", "owl", "panda", "parrot", "penguin", "pet", "pig", "pony", "puppy",
      "raccoon", "shark", "sloth", "snake", "tiger", "turtle", "whale", "zebra",

      // Vehicles
      "airplane", "bicycle", "boat", "bus", "car", "convertible", "helicopter", "hot air balloon",
      "jet", "limo", "motorcycle", "private jet", "race car", "rocket", "scooter", "skateboard",
      "sports car", "submarine", "tractor", "train", "truck", "yacht",

      // Tech & gadgets
      "camera", "computer", "drone", "game console", "keyboard", "laptop", "microphone",
      "new phone", "pair of headphones", "phone", "robot", "smartwatch", "speaker", "tablet",
      "TV", "video game",

      // Home & places
      "apartment", "backyard", "beach house", "bed", "blanket", "cabin", "castle", "cottage",
      "couch", "farm", "fireplace", "garden", "hammock", "hot tub", "house", "island", "lamp",
      "mansion", "pillow", "pool", "room of my own", "treehouse",

      // Clothes & accessories
      "backpack", "bracelet", "cape", "coat", "crown", "dress", "hat", "hoodie", "jacket",
      "necklace", "new outfit", "pair of boots", "pair of shoes", "pair of sneakers", "purse",
      "ring", "scarf", "sweater", "T-shirt", "tuxedo", "wallet", "watch",

      // Toys, hobbies & music
      "ball", "balloon", "board game", "book", "comic book", "doll", "drum set", "frisbee",
      "guitar", "kite", "piano", "puzzle", "stuffed animal", "teddy bear", "toy", "trampoline",
      "trumpet", "violin", "water gun", "yo-yo",

      // People
      "best friend", "boyfriend", "brother", "buddy", "friend", "girlfriend", "husband",
      "mentor", "partner", "roommate", "sister", "wife",

      // Nature
      "cactus", "flower", "plant", "rainbow", "rose", "snow day", "sunflower", "sunset", "tree",
      "waterfall",

      // Experiences & feelings
      "break", "chance", "day off", "do-over", "dream", "fresh start", "haircut", "high five",
      "holiday", "hug", "job", "kiss", "massage", "miracle", "nap", "party", "promotion", "raise",
      "road trip", "second chance", "shower", "surprise", "vacation", "weekend", "win",

      // Fantasy & wild wishes
      "dragon", "flying carpet", "genie", "gold bar", "jetpack", "magic wand", "million dollars",
      "pet dinosaur", "robot butler", "superpower", "time machine", "treasure chest", "unicorn",
      "wizard hat"
    ];


    // ===== 2. FIND THE PARTS OF THE PAGE WE NEED =====
    const searchArea = document.getElementById("search-area");
    const searchBox = document.getElementById("search-box");
    const wordList = document.getElementById("word-list");
    const universeButton = document.getElementById("universe-button");

    // Remembers which word is highlighted with the arrow keys.
    // -1 means "no word highlighted yet".
    let highlightedIndex = -1;


    // ===== 3. SHOW THE WORDS THAT MATCH WHAT'S TYPED =====
    function showMatches() {
      const typed = searchBox.value.toLowerCase();

      // Clear out the old list and reset the highlight
      wordList.innerHTML = "";
      highlightedIndex = -1;

      // Go through every word and add the ones that contain what was typed
      for (let i = 0; i < words.length; i++) {
        const word = words[i];

        if (word.toLowerCase().includes(typed)) {
          const option = document.createElement("span");
          option.className = "word-option";
          option.textContent = word;

          // Clicking a word picks it
          option.addEventListener("click", function () {
            pickWord(word);
          });

          wordList.appendChild(option);
        }
      }

      // Only show the list if at least one word matched
      wordList.hidden = (wordList.children.length === 0);
    }


    // ===== 4. PICK A WORD =====
    function pickWord(word) {
      searchBox.value = word;   // put the word in the search bar
      wordList.hidden = true;   // close the list
      updateButton();           // show the button
    }


    // ===== 5. SHOW OR HIDE THE BUTTON =====
    // The button only appears when the search bar holds a word from the list.
    function updateButton() {
      const typed = searchBox.value.toLowerCase();
      let wordIsOnList = false;

      for (let i = 0; i < words.length; i++) {
        if (words[i].toLowerCase() === typed) {
          wordIsOnList = true;
        }
      }

      universeButton.hidden = !wordIsOnList;
    }


    // ===== 6. HIGHLIGHT A WORD WITH THE ARROW KEYS =====
    function highlightOption() {
      const options = wordList.children;

      for (let i = 0; i < options.length; i++) {
        if (i === highlightedIndex) {
          options[i].classList.add("highlighted");
          options[i].scrollIntoView({ block: "nearest" }); // scroll the list if needed
        } else {
          options[i].classList.remove("highlighted");
        }
      }
    }


    // ===== 7. CONNECT EVERYTHING TO THE SEARCH BAR =====

    // Clicking into the search bar opens the list
    searchBox.addEventListener("focus", showMatches);
    searchBox.addEventListener("click", showMatches);

    // Typing updates the list and the button
    searchBox.addEventListener("input", function () {
      showMatches();
      updateButton();
    });

    // Keyboard controls: arrows to move, Enter to pick, Escape to close
    searchBox.addEventListener("keydown", function (event) {
      const optionCount = wordList.children.length;

      if (event.key === "ArrowDown") {
        event.preventDefault();            // stop the page from scrolling
        if (wordList.hidden) {
          showMatches();                   // open the list if it was closed
        } else if (highlightedIndex < optionCount - 1) {
          highlightedIndex++;
          highlightOption();
        }
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        if (highlightedIndex > 0) {
          highlightedIndex--;
          highlightOption();
        }
      } else if (event.key === "Enter") {
        if (!wordList.hidden && highlightedIndex >= 0) {
          pickWord(wordList.children[highlightedIndex].textContent);
        } else {
          wordList.hidden = true;
        }
      } else if (event.key === "Escape" || event.key === "Tab") {
        wordList.hidden = true;
      }
    });

    // Tapping or clicking anywhere else on the page closes the list
    document.addEventListener("pointerdown", function (event) {
      if (!searchArea.contains(event.target)) {
        wordList.hidden = true;
      }
    });
  </script>

</body>
</html>
