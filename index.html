<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Pie</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
  </style>
</head>

<!-- bgcolor="black" makes the whole page background black -->
<body bgcolor="black">

  <h1 style="color:white;">Damn.</h1>

  <!--
    THE SENTENCE
    The search box sits right where the blank goes.
    list="nouns" connects the box to the word list below (the <datalist> with id="nouns").
    When you type, the browser shows matching words from that list in a dropdown.
  -->
  <h2 style="color:white;">
    I really want a
    <input type="text" id="search-box" list="nouns" placeholder="Search..." autocomplete="off">
  </h2>

  <!--
    THE BUTTON
    "hidden" means it starts out invisible.
    The script at the bottom of the page makes it appear once a word is picked.
  -->
  <button id="universe-button" hidden>invent the universe</button>


  <!--
    THE WORD LIST
    Each <option value="..."> is one choice in the dropdown.
    To add a word, copy any option and change the text inside the quotes.
    The words are grouped by topic just to keep things tidy.
  -->

    <!-- Food & drinks -->
    <option value="apple"> <option value="apple pie"> <option value="bagel"> <option value="banana">
    <option value="burger"> <option value="burrito"> <option value="cake"> <option value="candy bar">
    <option value="cheeseburger"> <option value="cookie"> <option value="croissant"> <option value="cup of coffee">
    <option value="cup of tea"> <option value="cupcake"> <option value="donut"> <option value="hot dog">
    <option value="ice cream cone"> <option value="lollipop"> <option value="mango"> <option value="milkshake">
    <option value="muffin"> <option value="orange"> <option value="pancake"> <option value="peach">
    <option value="pickle"> <option value="pie"> <option value="pizza"> <option value="pretzel">
    <option value="sandwich"> <option value="slice of cake"> <option value="smoothie"> <option value="snack">
    <option value="soda"> <option value="steak"> <option value="taco"> <option value="waffle">
    <option value="watermelon">

    <!-- Animals -->
    <option value="alpaca"> <option value="bunny"> <option value="cat"> <option value="dog">
    <option value="dolphin"> <option value="duck"> <option value="elephant"> <option value="ferret">
    <option value="frog"> <option value="giraffe"> <option value="goat"> <option value="goldfish">
    <option value="hamster"> <option value="hedgehog"> <option value="horse"> <option value="kitten">
    <option value="koala"> <option value="lizard"> <option value="monkey"> <option value="octopus">
    <option value="otter"> <option value="owl"> <option value="panda"> <option value="parrot">
    <option value="penguin"> <option value="pet"> <option value="pig"> <option value="pony">
    <option value="puppy"> <option value="raccoon"> <option value="shark"> <option value="sloth">
    <option value="snake"> <option value="tiger"> <option value="turtle"> <option value="whale">
    <option value="zebra">

    <!-- Vehicles -->
    <option value="airplane"> <option value="bicycle"> <option value="boat"> <option value="bus">
    <option value="car"> <option value="convertible"> <option value="helicopter"> <option value="hot air balloon">
    <option value="jet"> <option value="limo"> <option value="motorcycle"> <option value="private jet">
    <option value="race car"> <option value="rocket"> <option value="scooter"> <option value="skateboard">
    <option value="sports car"> <option value="submarine"> <option value="tractor"> <option value="train">
    <option value="truck"> <option value="yacht">

    <!-- Tech & gadgets -->
    <option value="camera"> <option value="computer"> <option value="drone"> <option value="game console">
    <option value="keyboard"> <option value="laptop"> <option value="microphone"> <option value="new phone">
    <option value="pair of headphones"> <option value="phone"> <option value="robot"> <option value="smartwatch">
    <option value="speaker"> <option value="tablet"> <option value="TV"> <option value="video game">

    <!-- Home & places -->
    <option value="apartment"> <option value="backyard"> <option value="beach house"> <option value="bed">
    <option value="blanket"> <option value="cabin"> <option value="castle"> <option value="cottage">
    <option value="couch"> <option value="farm"> <option value="fireplace"> <option value="garden">
    <option value="hammock"> <option value="hot tub"> <option value="house"> <option value="island">
    <option value="lamp"> <option value="mansion"> <option value="pillow"> <option value="pool">
    <option value="room of my own"> <option value="treehouse">

    <option value="crown"> <option value="dress"> <option value="hat"> <option value="hoodie">
    <option value="jacket"> <option value="necklace"> <option value="new outfit"> <option value="pair of boots">

    <option value="scarf"> <option value="sweater"> <option value="T-shirt"> <option value="tuxedo">
    <option value="wallet"> <option value="watch">

    <!-- Toys, hobbies & music -->

    <option value="comic book"> <option value="doll"> <option value="drum set"> <option value="frisbee">
    <option value="guitar"> <option value="kite"> <option value="piano"> <option value="puzzle">
    <option value="stuffed animal"> <option value="teddy bear"> <option value="toy"> <option value="trampoline">
    <option value="trumpet"> <option value="violin"> <option value="water gun"> <option value="yo-yo">

    <option value="tree"> <option value="waterfall">

    <option value="break"> <option value="chance"> <option value="day off"> <option value="do-over">

    <option value="dragon"> <option value="flying carpet"> <option value="genie"> <option value="gold bar">
    <option value="jetpack"> <option value="magic wand"> <option value="million dollars"> <option value="pet dinosaur">
    <option value="robot butler"> <option value="superpower"> <option value="time machine"> <option value="treasure chest">
    <option value="unicorn"> <option value="wizard hat">

  </datalist>


  <!--
    THE SCRIPT
    This watches the search box. When what's in the box matches
    a word from the list, the button appears. Otherwise it stays hidden.
  -->
  <script>
    // Find the three things on the page we need to work with
    const searchBox = document.getElementById("search-box");
    const universeButton = document.getElementById("universe-button");
    const wordList = document.getElementById("nouns");

    // Run this code every time the text in the search box changes
    searchBox.addEventListener("input", function () {
      const chosenWord = searchBox.value;
      let wordIsOnList = false;

      // Go through every word in the list and check for a match
      for (let i = 0; i < wordList.options.length; i++) {
        if (wordList.options[i].value === chosenWord) {
          wordIsOnList = true;
        }
      }

      // Show the button if there was a match, hide it if not
      if (wordIsOnList) {
        universeButton.hidden = false;
      } else {
        universeButton.hidden = true;
      }
    });
  </script>

</body>
</html>
